name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install

      - name: Sinkronisasi Capacitor (Penting!)
        run: npx cap sync

      - name: Beri Izin Gradle
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build APK (Merakit Aplikasi)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Simpan APK untuk Didownload
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Management-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
